---
# OpenShift UPI GCP Ansible Variables
# Copy this file and customize for your environment

# GCP Configuration
gcp_project_id: "openenv-6d8kc"

# OpenShift Configuration
cluster_name: "ocp"
domain_name: "ocp.6d8kc.gcp.redhatworkshops.io"

# Infrastructure Configuration
bastion_zone: "us-central1-a"
bastion_user: "ubuntu"

# DNS Configuration
dns_zone: "ocp-zone"

# File Paths
ssh_key_path: "../keys/id_rsa"
kubeconfig_path: "../clusterconfig/auth/kubeconfig"

# Zone Configuration for multi-zone deployment
control_plane_zones:
  - "us-central1-a"
  - "us-central1-b" 
  - "us-central1-c"

worker_zones:
  - "us-central1-a"
  - "us-central1-b"
  - "us-central1-c"

# RHCOS Configuration
rhcos_version: "4.19.10"
rhcos_image_name: "rhcos-4-19-10"

# Pull secret for extracting release content (ccoctl, CredentialsRequests)
pull_secret_path: "../pull"

# GCP region (used by ccoctl for WIF setup)
region: "us-central1"

# Timeouts (seconds)
api_ready_timeout: 300
csr_approval_retries: 5


