---
- name: OpenShift UPI Complete Deployment Automation
  hosts: localhost
  gather_facts: false
  vars_files:
    - ansible-vars.yml
  
  tasks:
    # ================================
    # 1. Prerequisites Validation
    # ================================
    
    - name: Verify required tools are installed
      shell: "{{ item.cmd }}"
      register: tool_check
      failed_when: tool_check.rc != 0
      changed_when: false
      loop:
        - { cmd: "terraform --version" }
        - { cmd: "openshift-install version" }
        - { cmd: "gcloud --version" }
      tags: [prerequisites]

    - name: Check if gcloud is authenticated
      command: gcloud auth list --filter=status:ACTIVE --format="value(account)"
      register: gcloud_auth
      failed_when: gcloud_auth.stdout == ""
      changed_when: false
      tags: [prerequisites]

    - name: Verify SSH key exists
      stat:
        path: "{{ ssh_key_path }}"
      register: ssh_key_stat
      failed_when: not ssh_key_stat.stat.exists
      tags: [prerequisites]

    - name: Verify install-config.yaml exists
      stat:
        path: "../config/install-config.yaml"
      register: install_config_stat
      failed_when: not install_config_stat.stat.exists
      tags: [prerequisites]

    - name: Verify terraform.tfvars exists
      stat:
        path: "../terraform/terraform.tfvars"
      register: terraform_vars_stat
      failed_when: not terraform_vars_stat.stat.exists
      tags: [prerequisites]

    # ================================
    # 2. OpenShift Ignition Generation
    # ================================
    
    - name: Clean previous cluster configuration
      file:
        path: "../clusterconfig"
        state: absent
      tags: [ignition]

    - name: Create clusterconfig directory
      file:
        path: "../clusterconfig"
        state: directory
        mode: '0755'
      tags: [ignition]

    - name: Copy install-config.yaml to clusterconfig
      copy:
        src: "../config/install-config.yaml"
        dest: "../clusterconfig/install-config.yaml"
        mode: '0644'
      tags: [ignition]

    - name: Generate OpenShift manifests
      command: openshift-install create manifests --dir=../clusterconfig
      register: manifests_result
      tags: [ignition]

    # ================================
    # 2b. Workload Identity Federation (ccoctl)
    # ================================

    - name: Ensure ccoctl is installed
      shell: |
        if ! command -v ccoctl >/dev/null 2>&1; then
          echo "Extracting ccoctl from release image..."
          oc adm release extract \
            --command=ccoctl \
            quay.io/openshift-release-dev/ocp-release:4.19.0-x86_64 \
            -a {{ pull_secret_path }} \
            --to=/usr/local/bin/
          echo "ccoctl installed"
        else
          echo "ccoctl already installed"
        fi
      tags: [ignition, wif]

    - name: Create credrequests directory
      file:
        path: "../credrequests"
        state: directory
        mode: '0755'
      tags: [ignition, wif]

    - name: Extract CredentialsRequests from release image
      shell: |
        oc adm release extract \
          --credentials-requests \
          --cloud=gcp \
          --to=../credrequests \
          quay.io/openshift-release-dev/ocp-release:4.19.0-x86_64 \
          -a {{ pull_secret_path }}
      tags: [ignition, wif]

    - name: Create ccoctl output directory
      file:
        path: "../ccoctl-output"
        state: directory
        mode: '0755'
      tags: [ignition, wif]

    - name: Run ccoctl to create WIF resources and credential configs
      shell: |
        ccoctl gcp create-all \
          --name={{ cluster_name }}-cluster \
          --region={{ region }} \
          --project={{ gcp_project_id }} \
          --credentials-requests-dir=../credrequests \
          --output-dir=../ccoctl-output
      tags: [ignition, wif]

    - name: Copy ccoctl manifests into clusterconfig
      shell: |
        cp ../ccoctl-output/manifests/* ../clusterconfig/manifests/
      tags: [ignition, wif]

    - name: Copy ccoctl TLS material into clusterconfig
      shell: |
        cp -r ../ccoctl-output/tls ../clusterconfig/tls
      tags: [ignition, wif]

    - name: Verify Authentication resource issuer is set
      shell: |
        grep -l 'serviceAccountIssuer' ../clusterconfig/manifests/ 2>/dev/null || echo "Warning: no serviceAccountIssuer manifest found"
      register: issuer_check
      changed_when: false
      tags: [ignition, wif]

    - name: Generate OpenShift ignition configs
      command: openshift-install create ignition-configs --dir=../clusterconfig
      register: ignition_result
      tags: [ignition]

    - name: Verify ignition files were created
      stat:
        path: "../clusterconfig/{{ item }}"
      register: ignition_files
      failed_when: not ignition_files.stat.exists
      loop:
        - bootstrap.ign
        - master.ign
        - worker.ign
      tags: [ignition]

    - name: Display ignition generation status
      debug:
        msg: "✓ OpenShift ignition configs generated with WIF credentials"
      tags: [ignition]

    # ================================
    # 3. RHCOS Image Management
    # ================================
    
    - name: Check if RHCOS image exists in GCP
      shell: gcloud compute images describe {{ rhcos_image_name }} --format="value(name)" 2>/dev/null || echo "not_found"
      register: rhcos_image_check
      changed_when: false
      tags: [rhcos]

    - name: Display RHCOS image status
      debug:
        msg: "RHCOS image {{ rhcos_image_name }}: {{ 'EXISTS' if rhcos_image_check.stdout != 'not_found' else 'NOT FOUND - will download and upload' }}"
      tags: [rhcos]

    - name: Create artifacts directory
      file:
        path: "../artifacts"
        state: directory
        mode: '0755'
      when: rhcos_image_check.stdout == "not_found"
      tags: [rhcos]

    - name: Download RHCOS image
      get_url:
        url: "https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/4.19/{{ rhcos_version }}/rhcos-{{ rhcos_version }}-x86_64-gcp.x86_64.tar.gz"
        dest: "../artifacts/rhcos-{{ rhcos_version }}-x86_64-gcp.x86_64.tar.gz"
        mode: '0644'
        timeout: 300
      when: rhcos_image_check.stdout == "not_found"
      register: rhcos_download
      tags: [rhcos]

    - name: Get current GCP project ID
      shell: gcloud config get-value project
      register: gcp_project_id
      changed_when: false
      when: rhcos_image_check.stdout == "not_found"
      tags: [rhcos]

    - name: Create temporary GCS bucket for RHCOS image
      shell: gsutil mb gs://{{ gcp_project_id.stdout }}-rhcos-temp || true
      when: rhcos_image_check.stdout == "not_found"
      tags: [rhcos]

    - name: Upload RHCOS image to GCS
      shell: gsutil cp ../artifacts/rhcos-{{ rhcos_version }}-x86_64-gcp.x86_64.tar.gz gs://{{ gcp_project_id.stdout }}-rhcos-temp/
      when: rhcos_image_check.stdout == "not_found"
      tags: [rhcos]

    - name: Create RHCOS image in GCP
      shell: |
        gcloud compute images create {{ rhcos_image_name }} \
          --source-uri=gs://{{ gcp_project_id.stdout }}-rhcos-temp/rhcos-{{ rhcos_version }}-x86_64-gcp.x86_64.tar.gz \
          --guest-os-features=UEFI_COMPATIBLE \
          --description="Red Hat Enterprise Linux CoreOS {{ rhcos_version }}"
      when: rhcos_image_check.stdout == "not_found"
      register: rhcos_image_create
      tags: [rhcos]

    - name: Cleanup temporary GCS bucket
      shell: |
        gsutil rm gs://{{ gcp_project_id.stdout }}-rhcos-temp/rhcos-{{ rhcos_version }}-x86_64-gcp.x86_64.tar.gz
        gsutil rb gs://{{ gcp_project_id.stdout }}-rhcos-temp
      when: rhcos_image_check.stdout == "not_found"
      ignore_errors: true
      tags: [rhcos]

    - name: Display RHCOS image management status
      debug:
        msg: "{{ '✓ RHCOS image created successfully' if rhcos_image_check.stdout == 'not_found' else '✓ RHCOS image already exists' }}"
      tags: [rhcos]

    # ================================
    # 4. Terraform Infrastructure Deployment
    # ================================
    
    - name: Initialize Terraform
      terraform:
        project_path: "../terraform"
        state: present
        force_init: true
      register: terraform_init
      tags: [terraform]

    - name: Plan Terraform deployment
      terraform:
        project_path: "../terraform"
        state: planned
        plan_file: terraform.tfplan
      register: terraform_plan
      tags: [terraform]

    - name: Apply Terraform configuration
      terraform:
        project_path: "../terraform"
        state: present
        plan_file: terraform.tfplan
      register: terraform_apply
      tags: [terraform]

    - name: Display infrastructure deployment status
      debug:
        msg: "✓ GCP infrastructure deployed successfully"
      tags: [terraform]

    - name: Wait for infrastructure to stabilize
      pause:
        seconds: 30
      tags: [terraform]

    # ================================
    # 5. Environment Setup
    # ================================
    
    - name: Get bastion external IP
      shell: gcloud compute instances describe {{ cluster_name }}-bastion --zone={{ bastion_zone }} --format="value(networkInterfaces[0].accessConfigs[0].natIP)"
      register: bastion_external_ip
      changed_when: false

    - name: Display deployment info
      debug:
        msg: |
          Starting basic OpenShift UPI automation for cluster: {{ cluster_name }}
          Bastion External IP: {{ bastion_external_ip.stdout }}
          Domain: {{ domain_name }}

    # ================================
    # 2. Copy kubeconfig to bastion
    # ================================
    
    - name: Ensure clusterconfig directory exists on bastion
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        mkdir -p ~/clusterconfig/auth'
      changed_when: false

    - name: Copy kubeconfig to bastion
      shell: |
        scp -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ kubeconfig_path }} {{ bastion_user }}@{{ bastion_external_ip.stdout }}:~/clusterconfig/auth/kubeconfig

    - name: Download oc CLI on bastion
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        if ! command -v oc >/dev/null 2>&1; then
          echo "Downloading oc CLI..."
          curl -LO "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz"
          tar xzf openshift-client-linux.tar.gz oc kubectl
          sudo mv oc kubectl /usr/local/bin/
          rm -f openshift-client-linux.tar.gz
          echo "oc CLI installed"
        else
          echo "oc CLI already installed"
        fi'

    # ================================
    # 3. Get Infrastructure IPs
    # ================================
    
    - name: Get control plane IPs
      shell: |
        gcloud compute instances describe {{ cluster_name }}-control-1 --zone={{ control_plane_zones[0] }} --format="value(networkInterfaces[0].networkIP)"
        gcloud compute instances describe {{ cluster_name }}-control-2 --zone={{ control_plane_zones[1] }} --format="value(networkInterfaces[0].networkIP)"
        gcloud compute instances describe {{ cluster_name }}-control-3 --zone={{ control_plane_zones[2] }} --format="value(networkInterfaces[0].networkIP)"
      register: control_plane_ips_output
      changed_when: false

    - name: Set control plane IPs list
      set_fact:
        control_plane_ips: "{{ control_plane_ips_output.stdout_lines }}"

    - name: Display infrastructure IPs
      debug:
        msg: |
          Control Plane IPs: {{ control_plane_ips }}

    # ================================
    # 4. Wait for Bootstrap and Control Planes
    # ================================
    
    - name: Wait for bootstrap to complete and control planes to be ready
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "Waiting for bootstrap to complete and control planes to be ready..."
        
        # Wait for API to be accessible (bootstrap takes 20-40 min)
        echo "Step 1: Waiting for API server to be accessible..."
        for i in {1..60}; do
          if oc get nodes >/dev/null 2>&1; then
            echo "✓ API server is accessible"
            break
          fi
          echo "  Waiting for API... ($i/60)"
          sleep 20
        done

        # Check if control planes are ready
        echo "Step 2: Waiting for control planes to be Ready..."
        for i in {1..60}; do
          READY_NODES=$(oc get nodes --no-headers | grep "control-plane" | grep " Ready " | wc -l 2>/dev/null || echo "0")
          echo "  Ready control plane nodes: $READY_NODES/3 ($i/60)"

          if [ "$READY_NODES" -ge "2" ]; then
            echo "✓ Bootstrap phase complete - control planes are ready"
            oc get nodes
            exit 0
          fi
          sleep 20
        done

        echo "✗ Bootstrap did not complete in time"
        oc get nodes || echo "API not accessible"
        exit 1'
      register: bootstrap_status
      retries: 1
      until: bootstrap_status.rc == 0

    # ================================
    # 6. DNS Transition for api-int and api
    # ================================

    - name: Get bootstrap IP for comparison
      shell: gcloud compute instances describe {{ cluster_name }}-bootstrap --zone={{ bastion_zone }} --format="value(networkInterfaces[0].networkIP)"
      register: bootstrap_ip
      changed_when: false

    - name: Wait for kube-apiserver to be running on at least 2 control planes
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "Waiting for kube-apiserver on control planes before DNS flip..."
        for i in {1..90}; do
          API_UP=0
          for ip in {{ control_plane_ips | join(" ") }}; do
            status=$(curl -sk --connect-timeout 2 https://$ip:6443/healthz 2>&1)
            if [ "$status" = "ok" ]; then
              API_UP=$((API_UP + 1))
            fi
          done
          echo "  kube-apiserver on CPs: $API_UP/3 ($i/90)"
          if [ "$API_UP" -ge "2" ]; then
            echo "✓ Safe to flip DNS"
            exit 0
          fi
          sleep 20
        done
        echo "✗ Timed out waiting for kube-apiserver on control planes"
        exit 1'
      register: apiserver_wait
      when: bootstrap_status.rc == 0

    - name: Flip api-int DNS from bootstrap to control planes
      shell: |
        gcloud dns record-sets update "api-int.{{ domain_name }}." \
          --zone={{ dns_zone }} --type=A --ttl=300 \
          --rrdatas="{{ control_plane_ips | join(',') }}"
        echo "✓ api-int DNS now points to control planes"
      when: bootstrap_status.rc == 0 and apiserver_wait.rc == 0

    - name: Remove bootstrap IP from api DNS
      shell: |
        gcloud dns record-sets update "api.{{ domain_name }}." \
          --zone={{ dns_zone }} --type=A --ttl=300 \
          --rrdatas="{{ control_plane_ips | join(',') }}"
        echo "✓ api DNS now points to control planes only"
      when: bootstrap_status.rc == 0 and apiserver_wait.rc == 0

    - name: Display bootstrap completion status
      debug:
        msg: |
          ✓ Bootstrap phase completed successfully!
          ✓ Control planes are ready
          ✓ api-int and api DNS transitioned to control planes

          Next: Waiting for workers to join...

    # ================================
    # 7. Worker CSR Approval
    # ================================
    
    - name: Wait for worker nodes to submit CSRs
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "Waiting for worker CSRs to appear..."

        for i in {1..30}; do
          PENDING_CSRS=$(oc get csr --no-headers 2>/dev/null | grep "Pending" | wc -l || echo "0")
          echo "  Pending CSRs: $PENDING_CSRS ($i/30)"

          if [ "$PENDING_CSRS" -ge "1" ]; then
            echo "✓ Worker CSRs found, ready for approval"
            exit 0
          fi
          sleep 20
        done

        echo "⚠ No worker CSRs found yet, continuing anyway"
        exit 0'
      register: csr_wait_status

    - name: Approve all pending CSRs
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "Approving all pending CSRs..."
        PENDING=$(oc get csr --no-headers 2>/dev/null | grep "Pending" | awk "{print \$1}")
        if [ -n "$PENDING" ]; then
          for csr in $PENDING; do
            oc certificate approve $csr
            echo "  ✓ Approved: $csr"
          done
        else
          echo "No pending CSRs found"
        fi'
      register: csr_approval_result

    - name: Wait for workers to join cluster
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "Waiting for worker nodes to join cluster..."

        for i in {1..30}; do
          # Approve any new pending CSRs (serving certs appear after initial approval)
          PENDING=$(oc get csr --no-headers 2>/dev/null | grep "Pending" | awk "{print \$1}")
          if [ -n "$PENDING" ]; then
            for csr in $PENDING; do
              oc certificate approve $csr 2>/dev/null
              echo "  ✓ Auto-approved CSR: $csr"
            done
          fi

          READY_WORKERS=$(oc get nodes --no-headers 2>/dev/null | grep "worker" | grep " Ready " | wc -l || echo "0")
          echo "  Ready workers: $READY_WORKERS/2 ($i/30)"

          if [ "$READY_WORKERS" -ge "2" ]; then
            echo "✓ All worker nodes are Ready"
            oc get nodes
            exit 0
          fi
          sleep 20
        done

        echo "⚠ Not all workers ready, but continuing"
        oc get nodes || echo "No nodes found"
        exit 0'
      register: worker_join_status

    # ================================
    # 8. Bastion Setup
    # ================================

    - name: Copy SSH private key to bastion for node access
      shell: |
        scp -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ ssh_key_path }} {{ bastion_user }}@{{ bastion_external_ip.stdout }}:~/.ssh/id_rsa
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} 'chmod 600 ~/.ssh/id_rsa'

    # ================================
    # 9. Remove cloud-provider uninitialized taint
    # ================================

    - name: Remove cloud-provider uninitialized taint from all nodes
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "Removing uninitialized taints..."
        for node in $(oc get nodes -o name); do
          oc adm taint $node node.cloudprovider.kubernetes.io/uninitialized- 2>/dev/null && echo "  ✓ Untainted $node" || true
        done
        echo "✓ All uninitialized taints removed"
        '
      retries: 3
      delay: 10
      register: taint_removal
      until: taint_removal.rc == 0

    # ================================
    # 10. Enable GCP Filestore CSI Driver + StorageClass
    # ================================

    - name: Enable Filestore CSI driver and create StorageClass
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig

        echo "Enabling GCP Filestore CSI driver..."
        cat <<EOF | oc apply -f -
        apiVersion: operator.openshift.io/v1
        kind: ClusterCSIDriver
        metadata:
          name: filestore.csi.storage.gke.io
        spec:
          managementState: Managed
        EOF

        echo "Creating Filestore StorageClass..."
        cat <<EOF | oc apply -f -
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: filestore-rwx
        provisioner: filestore.csi.storage.gke.io
        parameters:
          connect-mode: DIRECT_PEERING
          network: {{ cluster_name }}-vpc
          tier: BASIC_HDD
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        EOF

        echo "✓ Filestore CSI driver enabled and StorageClass created"
        oc get sc 2>&1
        '
      register: filestore_setup

    # ================================
    # 10b. Wait for ingress LoadBalancer to provision
    # ================================

    - name: Wait for ingress LoadBalancer to get external IP
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "Waiting for ingress LoadBalancer to provision..."
        for i in {1..30}; do
          LB_IP=$(oc get svc router-default -n openshift-ingress -o jsonpath="{.status.loadBalancer.ingress[0].ip}" 2>/dev/null)
          if [ -n "$LB_IP" ]; then
            echo "✓ Ingress LoadBalancer provisioned: $LB_IP"
            exit 0
          fi
          echo "  Waiting for LB... ($i/30)"
          sleep 20
        done
        echo "⚠ LB not yet provisioned, continuing"
        exit 0'
      register: lb_wait

    # ================================
    # 11. Final Cluster Status
    # ================================
    
    - name: Check final cluster status
      shell: |
        ssh -i {{ ssh_key_path }} -o StrictHostKeyChecking=no {{ bastion_user }}@{{ bastion_external_ip.stdout }} '
        export KUBECONFIG=~/clusterconfig/auth/kubeconfig
        echo "=== Final Cluster Status ==="
        oc get nodes
        echo ""
        echo "=== Cluster Operators Status ==="
        oc get clusteroperators | head -10'
      register: final_status
      ignore_errors: true

    - name: Display cluster status
      debug:
        var: final_status.stdout_lines

    - name: Display deployment summary
      debug:
        msg: |
          🎉 OpenShift UPI Complete Deployment Finished!
          
          ✅ Completed Steps:
          1. ✓ Prerequisites validated
          2. ✓ OpenShift ignition configs generated
          3. ✓ RHCOS image available in GCP
          4. ✓ GCP infrastructure deployed with Terraform
          5. ✓ Bootstrap phase completed successfully
          6. ✓ Control planes are Ready
          7. ✓ api-int DNS transitioned from bootstrap to control planes  
          8. ✓ Worker CSRs approved automatically
          9. ✓ Workers joined cluster
          
          🚀 Ready to Use:
          - Export kubeconfig: export KUBECONFIG=../clusterconfig/auth/kubeconfig
          - Check cluster: oc get nodes
          - Access console: https://console-openshift-console.apps.{{ domain_name }}
          - Admin password: cat ../clusterconfig/auth/kubeadmin-password
          
          📋 Management Commands:
          - SSH to bastion: ssh -i {{ ssh_key_path }} {{ bastion_user }}@{{ bastion_external_ip.stdout }}
          - Monitor operators: oc get clusteroperators
          - Destroy cluster: cd ../terraform && terraform destroy


